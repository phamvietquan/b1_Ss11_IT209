name: Java Spring Boot CI (Gradle) - With Registry Login

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ma nguon
        uses: actions/checkout@v5

      - name: Thiet lap moi truong Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cap quyen cho Gradle Wrapper
        run: chmod +x gradlew

      - name: Thuc thi JUnit Test voi Gradle
        run: ./gradlew test

      - name: Dang nhap vao GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
